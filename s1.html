<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>安全位置回報聊天室</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    #chatroom {
      border: 1px solid #ccc;
      height: 200px;
      overflow-y: auto;
      padding: 10px;
      margin: 15px auto;
      max-width: 500px;
      text-align: left;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    #maplink {
      display: block;
      margin-top: 10px;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h1>安全位置回報</h1>

  <button onclick="getLocation()">回報我的位置</button>

  <div id="chatroom"></div>

  <a id="maplink" href="#" target="_blank" style="display:none;">📍 點此查看地圖</a>

  <script>
    const chatroom = document.getElementById('chatroom');
    const maplink = document.getElementById('maplink');

    function addMessage(text) {
      const msg = document.createElement('div');
      msg.textContent = `${new Date().toLocaleTimeString()}：${text}`;
      chatroom.appendChild(msg);
      chatroom.scrollTop = chatroom.scrollHeight;
    }

    function getLocation() {
      if (!navigator.geolocation) {
        addMessage('❌ 瀏覽器不支援定位功能');
        return;
      }

      addMessage('📡 正在取得位置中...');

      navigator.geolocation.getCurrentPosition(
        success,
        error,
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        }
      );
    }

    function success(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      addMessage(
        `📍 位置回報成功：緯度 ${lat.toFixed(6)}，經度 ${lng.toFixed(6)}（誤差約 ${accuracy.toFixed(0)} 公尺）`
      );

      const url = `https://www.google.com/maps/search/?api=1&query=${lat},${lng}`;
      maplink.href = url;
      maplink.style.display = 'block';

      console.log('位置資料：', { lat, lng });
    }

    function error(err) {
      let msg = '❌ 取得位置失敗：';

      switch (err.code) {
        case err.PERMISSION_DENIED:
          msg += '使用者拒絕定位權限';
          break;
        case err.POSITION_UNAVAILABLE:
          msg += '位置資訊不可用';
          break;
        case err.TIMEOUT:
          msg += '定位請求逾時';
          break;
        default:
          msg += '未知錯誤';
      }

      addMessage(msg);
    }
  </script>

</body>
</html>
