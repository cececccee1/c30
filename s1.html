<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>行動通訊訊息分享</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    #chatroom {
      max-width: 400px;
      height: 400px;
      margin: auto;
      background: white;
      border: 1px solid #ccc;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      margin: 8px 0;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 75%;
      font-size: 14px;
      position: relative;
    }

    .me {
      background: #007bff;
      color: white;
      margin-left: auto;
    }

    .other {
      background: #e5e5ea;
      color: black;
      margin-right: auto;
    }

    .time {
      font-size: 10px;
      opacity: 0.7;
      margin-top: 4px;
    }

    .share-btn {
      font-size: 12px;
      margin-top: 4px;
      background: rgba(255,255,255,0.2);
      border: none;
      color: white;
      cursor: pointer;
    }

    .input-area {
      max-width: 400px;
      margin: 10px auto;
      display: flex;
    }

    input {
      flex: 1;
      padding: 10px;
    }

    button {
      padding: 10px;
    }
  </style>
</head>

<body>

  <h2 style="text-align:center;">行動通訊聊天室</h2>

  <div id="chatroom"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="輸入訊息..." />
    <button onclick="sendMessage()">送出</button>
  </div>

  <script>
    const chatroom = document.getElementById('chatroom');
    const input = document.getElementById('messageInput');

    const myUser = '我';
    const otherUser = '對方';

    function addMessage(sender, text) {
      const msg = document.createElement('div');
      msg.classList.add('msg');
      msg.classList.add(sender === myUser ? 'me' : 'other');

      const time = new Date().toLocaleTimeString();

      msg.innerHTML = `
        <div>${text}</div>
        <div class="time">${sender} · ${time}</div>
      `;

      // ✅ 只對「我」的訊息加分享功能
      if (sender === myUser) {
        const shareBtn = document.createElement('button');
        shareBtn.textContent = '📤 分享';
        shareBtn.className = 'share-btn';
        shareBtn.onclick = () => shareMessage(text);
        msg.appendChild(shareBtn);
      }

      chatroom.appendChild(msg);
      chatroom.scrollTop = chatroom.scrollHeight;
    }

    function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(myUser, text);

      // 模擬 API 傳送
      fetch('/sendMessage', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          from: myUser,
          to: otherUser,
          message: text,
          time: new Date().toISOString()
        })
      }).catch(() => {});

      input.value = '';

      // 模擬對方回覆
      setTimeout(() => {
        addMessage(otherUser, '已收到你的訊息');
      }, 1000);
    }

    // ✅ Web Share API
    function shareMessage(text) {
      if (navigator.share) {
        navigator.share({
          title: '分享訊息',
          text: text
        });
      } else {
        alert('此裝置不支援分享功能');
      }
    }

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });
  </script>

</body>
</html>
