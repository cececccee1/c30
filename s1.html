<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>簡單聊天室 - 傳送位置與訊息</title>
    <style>
        #chatroom { 
            border: 1px solid #ccc; 
            height: 250px; 
            overflow-y: scroll; 
            padding: 10px; 
            margin-bottom: 10px; 
            background: #f9f9f9;
        }
        #messageInput { 
            width: 70%; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
        }
        button { 
            padding: 10px 15px; 
            background: #007bff; 
            color: white; 
            border: none; 
            cursor: pointer; 
            border-radius: 4px; 
            margin-left: 5px;
        }
        button:hover { background: #0056b3; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .message { 
            margin-bottom: 8px; 
            padding: 8px; 
            background: white; 
            border-radius: 4px; 
            position: relative;
        }
        .share-btn {
            font-size: 12px;
            padding: 4px 6px;
            margin-top: 5px;
            background: #28a745;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>簡單聊天室 - 傳送位置與訊息</h2>
    <div id="chatroom"></div>
    
    <input type="text" id="messageInput" placeholder="輸入訊息..." maxlength="200">
    <button onclick="sendMessage()">傳送訊息</button>
    <button onclick="getLocation()">📍 取得並傳送我的位置</button>

    <script>
        const chatroom = document.getElementById('chatroom');
        const messageInput = document.getElementById('messageInput');

        function addMessage(text, isLocation = false) {
            const msg = document.createElement('div');
            msg.className = 'message';

            const time = new Date().toLocaleTimeString('zh-TW');

            msg.innerHTML = `
                <strong>${time}：</strong>
                <div>${text}</div>
            `;

            if (isLocation) {
                msg.style.background = '#e8f5e8';
                msg.style.borderLeft = '4px solid #28a745';
            }

            /* ✅ 分享按鈕 */
            const shareBtn = document.createElement('button');
            shareBtn.textContent = '📤 分享';
            shareBtn.className = 'share-btn';
            shareBtn.onclick = () => shareMessage(text);
            msg.appendChild(shareBtn);

            chatroom.appendChild(msg);
            chatroom.scrollTop = chatroom.scrollHeight;
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;
            
            addMessage(text);
            messageInput.value = '';
            
            console.log('傳送訊息：', text);
        }

        function getLocation() {
            if (!navigator.geolocation) {
                addMessage('❌ 瀏覽器不支援 Geolocation API');
                return;
            }
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '取得中...';
            
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;

                    const locationMsg = `
                        📍 我的位置：緯度 ${lat.toFixed(6)}, 經度 ${lng.toFixed(6)}
                        (精確度 ${accuracy.toFixed(0)}m)<br>
                        https://maps.google.com/?q=${lat},${lng}
                    `;

                    addMessage(locationMsg, true);
                    
                    btn.disabled = false;
                    btn.textContent = '📍 取得並傳送我的位置';
                },
                function(error) {
                    let msg = '❌ 取得位置失敗：';
                    switch(error.code) {
                        case error.PERMISSION_DENIED: msg += '使用者拒絕分享位置'; break;
                        case error.POSITION_UNAVAILABLE: msg += '位置資訊不可用'; break;
                        case error.TIMEOUT: msg += '請求超時'; break;
                        default: msg += '未知錯誤';
                    }
                    addMessage(msg);
                    
                    btn.disabled = false;
                    btn.textContent = '📍 取得並傳送我的位置';
                }
            );
        }

        /* ✅ Web Share API */
        function shareMessage(text) {
            if (navigator.share) {
                navigator.share({
                    title: '分享聊天室訊息',
                    text: text
                });
            } else {
                alert('此裝置不支援分享功能');
            }
        }

        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
