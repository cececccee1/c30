<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安全位置回報系統 - 行動通訊</title>
    
    <!-- Leaflet開源地圖 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 20px; 
            max-width: 600px; 
            margin: 0 auto;
        }
        h1 { color: #007bff; }
        button { 
            padding: 15px 25px; 
            font-size: 18px; 
            margin: 10px; 
            border: none; 
            border-radius: 8px; 
            cursor: pointer;
        }
        .locate-btn { background: #007bff; color: white; }
        .share-btn { background: #28a745; color: white; }
        .share-btn:hover { background: #218838; }
        #status { 
            margin: 20px 0; 
            font-size: 20px; 
            padding: 15px; 
            border-radius: 8px; 
            background: #f8f9fa;
        }
        #map { 
            height: 350px; 
            margin: 20px auto; 
            border: 3px solid #007bff; 
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <h1>📍 安全位置回報系統</h1>
    
    <!-- 長輩定位按鈕 -->
    <div id="locate-section">
        <button class="locate-btn" onclick="getLocation()">
            📱 長輩：取得目前位置
        </button>
    </div>
    
    <!-- 狀態顯示 -->
    <div id="status">請按鈕取得位置，然後分享給家人</div>
    
    <!-- 地圖 -->
    <div id="map"></div>
    
    <!-- 分享按鈕（定位後出現） -->
    <div id="share-section" class="hidden">
        <button class="share-btn" onclick="shareSMS()">
            📱 分享簡訊給家人
        </button>
        <button class="share-btn" onclick="shareWeb()">
            📤 分享（LINE/WhatsApp）
        </button>
        <button class="locate-btn" onclick="getNewLocation()">
            🔄 重新定位
        </button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        let currentLat, currentLng, map;
        
        // 檢查是否為家人分享連結
        const urlParams = new URLSearchParams(window.location.search);
        const shareLat = parseFloat(urlParams.get('lat'));
        const shareLng = parseFloat(urlParams.get('lng'));
        
        if (shareLat && shareLng) {
            showLocation(shareLat, shareLng, '👨‍👩‍👧‍👦 家人查看模式');
        }
        
        function getLocation() {
            if (!navigator.geolocation) {
                document.getElementById('status').innerHTML = '❌ 瀏覽器不支援定位';
                return;
            }
            
            document.getElementById('status').innerHTML = '📡 GPS定位中，請稍候...';
            document.querySelector('.locate-btn').disabled = true;
            
            navigator.geolocation.getCurrentPosition(
                position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    showLocation(lat, lng, '✅ 長輩定位成功');
                },
                error => {
                    let msg = '❌ 定位失敗：';
                    switch(error.code) {
                        case error.PERMISSION_DENIED: msg += '請允許定位權限'; break;
                        case error.POSITION_UNAVAILABLE: msg += '無法取得位置訊號'; break;
                        case error.TIMEOUT: msg += '定位超時'; break;
                        default: msg += '未知錯誤';
                    }
                    document.getElementById('status').innerHTML = msg;
                    document.querySelector('.locate-btn').disabled = false;
                },
                { 
                    enableHighAccuracy: true,  // 高精度
                    timeout: 15000,           // 15秒超時
                    maximumAge: 30000         // 30秒內快取有效
                }
            );
        }
        
        function showLocation(lat, lng, statusMsg) {
            currentLat = lat;
            currentLng = lng;
            
            document.getElementById('status').innerHTML = 
                `${statusMsg}<br>` +
                `📍 緯度：${lat.toFixed(6)}<br>` +
                `📍 經度：${lng.toFixed(6)}<br>` +
                `⏰ 時間：${new Date().toLocaleString('zh-TW')}`;
            
            // 隱藏定位按鈕，顯示分享
            document.getElementById('locate-section').classList.add('hidden');
            document.getElementById('share-section').classList.remove('hidden');
            
            // 畫地圖
            if (map) map.remove();
            map = L.map('map').setView([lat, lng], 16);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '© OpenStreetMap'
            }).addTo(map);
            L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>目前位置</b><br>${lat.toFixed(6)}, ${lng.toFixed(6)}`)
                .openPopup();
        }
        
        // 📱 簡訊分享（核心通訊功能）
        function shareSMS() {
            const shareUrl = `${window.location.origin}${window.location.pathname}?lat=${currentLat}&lng=${currentLng}`;
            const message = `安全位置回報：${shareUrl}`;
            window.open(`sms:?body=${encodeURIComponent(message)}`, '_blank');
        }
        
        // 📤 Web分享（現代手機支援）
        function shareWeb() {
            if (navigator.share) {
                navigator.share({
                    title: '安全位置回報',
                    text: `位置：${currentLat.toFixed(6)}, ${currentLng.toFixed(6)}`,
                    url: `${window.location.origin}${window.location.pathname}?lat=${currentLat}&lng=${currentLng}`
                });
            } else {
                const shareUrl = `${window.location.origin}${window.location.pathname}?lat=${currentLat}&lng=${currentLng}`;
                navigator.clipboard.writeText(shareUrl).then(() => {
                    alert('分享連結已複製！可貼到LINE/簡訊');
                });
            }
        }
        
        // 🔄 重新定位
        function getNewLocation() {
            document.getElementById('share-section').classList.add('hidden');
            document.getElementById('locate-section').classList.remove('hidden');
            document.getElementById('status').innerHTML = '請重新按取得位置';
            if (map) map.remove();
            document.querySelector('.locate-btn').disabled = false;
        }
    </script>
</body>
</html>
